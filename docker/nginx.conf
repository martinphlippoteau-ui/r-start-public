# Service du site statique R Start dans le conteneur (App Service Linux, port 80).
# Équivalent nginx de public/staticwebapp.config.json : en-têtes de sécurité, cache, page 404.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # App Service termine TLS en amont : la redirection HTTPS est faite par la plateforme.
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # En-têtes de sécurité (identiques à la configuration Static Web Apps).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  # CSP en observation d'abord : passer à Content-Security-Policy après vérification des tags GTM/GA4.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https://*.googletagmanager.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

  # Ressources versionnées par le build : cache long et immuable.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Documents réglementaires : ouverts dans le navigateur, cache d'une journée.
  location /documents/ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header Content-Disposition "inline" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Images, polices et icônes : une semaine.
  location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2)$ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # Pages : Astro génère /frais/index.html, /documentation/index.html, etc.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
  }
}
