# Prévisualisation du site R Start sur GitHub Pages (non indexée, sous-chemin /r-start-public).
#
# Les actions sont épinglées sur le SHA du commit, l'étiquette restant en commentaire (14/09/2026) :
# une étiquette se déplace, et qui contrôle le dépôt d'une action contrôlerait ce qui s'exécute ici,
# avec le jeton de publication Pages et le secret PREVIEW_PASSWORD à portée. Pour mettre à jour,
# résoudre l'étiquette voulue :
#   curl -s https://api.github.com/repos/<dépôt>/commits/<étiquette> | jq -r .sha
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Site de projet : servi sous https://<compte>.github.io/<dépôt>/
  PUBLIC_SITE_URL: https://martinphlippoteau-ui.github.io
  PUBLIC_BASE_PATH: r-start-public
  # Prévisualisation interne : aucune indexation par les moteurs de recherche.
  PUBLIC_NOINDEX: 'true'
  # Rogne la mention « Nos avis 4 et 5 étoiles » que Trustpilot écrit sous son carrousel filtré
  # (15/09/2026, demande de l'équipe). Cette variable est ATTACHÉE AU RÉGIME DE PRÉVISUALISATION :
  # elle ne tient que parce que ce déploiement est chiffré par mot de passe (étape « Protection par
  # mot de passe », secret PREVIEW_PASSWORD) et en noindex ci-dessus. Aucun épargnant ne le voit.
  #
  # À RETIRER LE JOUR OÙ LE SITE S'OUVRE AU PUBLIC, en même temps que PUBLIC_NOINDEX et que l'écran de
  # mot de passe : masquer cette mention devant de vrais visiteurs présenterait une sélection d'avis
  # favorables comme si elle n'en était pas une. Les deux sorties propres sont alors de retirer le
  # filtre (`stars` dans src/content/fr/facts.ts) ou de changer de gabarit Trustpilot.
  PUBLIC_TRUSTBOX_CROP: 'true'
  # Vide tant que le tunnel de souscription n'a pas ouvert : les CTA ouvrent la fenêtre d'attente.
  # Le jour de l'ouverture, passer à 'true' ET renseigner PUBLIC_SUBSCRIBE_URL.
  PUBLIC_SUBSCRIBE_OPEN: ''
  # Conteneur GTM (14/09/2026). Chargé seulement après accord du visiteur, jamais dans le <head>.
  PUBLIC_GTM_ID: GTM-K7B4GX8Z

jobs:
  build:
    name: Build et contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      # `pnpm build` lance déjà `astro check` : le typage est donc contrôlé ici.
      - name: Build
        run: pnpm build

      - name: Validation HTML
        run: pnpm test:html

      - name: Contrôle de conformité AMF
        run: pnpm test:compliance

      # Les 160 tests Playwright ne tournaient nulle part avant une mise en ligne (audit du 14/09/2026) :
      # toute la protection écrite depuis le début du projet était purement locale, donc facultative.
      # Le navigateur est mis en cache d'une exécution à l'autre ; seul Chromium est installé, les trois
      # profils du projet (bureau, Pixel 5, iPhone 13) s'appuient tous dessus.
      - name: Cache du navigateur Playwright
        id: cache-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Installation du navigateur
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Dépendances système du navigateur
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # NON BLOQUANT POUR L'INSTANT (14/09/2026, décision de l'équipe). La première exécution en CI a
      # vu quatre-vingt-treize tests tomber, la deuxième dépasser vingt minutes : la barrière ajoutée
      # pour corriger le premier constat de l'audit empêchait toute mise en ligne, correctifs de
      # sécurité compris. Elle reste en place et visible dans l'onglet Actions, mais elle ne retient
      # plus la publication, et un plafond de huit minutes l'empêche de s'éterniser.
      #
      # À REPASSER BLOQUANT dès que la suite tient dans son plafond deux fois de suite : il suffit de
      # retirer `continue-on-error`. Tant que cette ligne est là, le vert du workflow ne dit RIEN de
      # l'état des tests, il faut ouvrir l'étape ou lire le rapport téléversé.
      - name: Tests de bout en bout
        run: pnpm exec playwright test
        continue-on-error: true
        timeout-minutes: 8

      # Le rapport dit quel test a cédé et sur quel profil. `always()` et non `failure()` : l'étape
      # précédente ne rapporte plus d'échec au job, le rapport ne serait jamais téléversé sans cela.
      # Le rapporteur `html` a été ajouté à playwright.config.ts le 14/09/2026 : sans lui, cette étape
      # archivait un dossier que rien n'écrivait, et l'artefact était vide à chaque exécution.
      # `test-results/` accompagne le rapport : c'est là que vivent les traces des tests en échec.
      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Chiffre chaque page derrière un écran de mot de passe. Sans le secret PREVIEW_PASSWORD,
      # l'étape échoue : rien n'est publié sans protection.
      - name: Protection par mot de passe
        run: node scripts/encrypt-preview.mjs
        env:
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
