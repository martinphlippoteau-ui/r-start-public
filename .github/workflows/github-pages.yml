# Prévisualisation du site R Start sur GitHub Pages (non indexée, sous-chemin /r-start-public).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Site de projet : servi sous https://<compte>.github.io/<dépôt>/
  PUBLIC_SITE_URL: https://martinphlippoteau-ui.github.io
  PUBLIC_BASE_PATH: r-start-public
  # Prévisualisation interne : aucune indexation par les moteurs de recherche.
  PUBLIC_NOINDEX: 'true'

jobs:
  build:
    name: Build et contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validation HTML
        run: pnpm test:html

      - name: Contrôle de conformité AMF
        run: pnpm test:compliance

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
